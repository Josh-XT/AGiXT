[package]
name = "agixt-desktop"
version = "0.1.0"
description = "AGiXT Desktop client - persistent always-on-top sidebar chat with full local desktop control"
authors = ["XT Systems"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "agixt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agixt-desktop-cli"
path = "src/bin/cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
futures-util = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
once_cell = "1"
url = "2"

# Desktop input automation (mouse, keyboard) — feature-gated to allow building
# headless on machines without X11/Wayland display libs.
enigo = { version = "0.2", optional = true }
screenshots = { version = "0.8", optional = true }

# PTY-backed terminal sessions (background shells the agent can drive)
portable-pty = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri on Linux needs gtk for system tray + window decorations.
# We also poke at gdk window-type-hints to get mutter to treat our
# popover as a Utility window (i.e., never tile-snap it).
gtk = "0.18"
gdk = "0.18"

[features]
default = ["automation"]
automation = ["dep:enigo", "dep:screenshots"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
