[package]
name = "agixt"
version = "0.1.0"
description = "AGiXT Desktop client - persistent always-on-top sidebar chat with full local desktop control"
authors = ["XT Systems"]
edition = "2021"
rust-version = "1.77"
default-run = "agixt"

[lib]
name = "agixt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agixt"
path = "src/main.rs"

[[bin]]
name = "agixt-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "agixt-desktop"
path = "src/bin/agixt-desktop.rs"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
futures-util = "0.3"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
once_cell = "1"
url = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
enigo = { version = "0.2", optional = true }
screenshots = { version = "0.8", optional = true }
portable-pty = "0.8"
cpal = "0.15"
hound = "3.5"
# Local transcription for the audible reader. `whisper-rs` is a thin
# safe wrapper over whisper.cpp; the GGML `base` model is ~140MB and
# runs comfortably on CPU. We pull symphonia for in-process audio
# decoding so we don't have to shell out to ffmpeg per chunk just to
# extract PCM samples.
whisper-rs = { version = "0.13", default-features = false }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "isomp4", "aac", "wav", "flac"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri on Linux needs gtk for system tray + window decorations.
# We also poke at gdk window-type-hints to get mutter to treat our
# popover as a Utility window (i.e., never tile-snap it).
gtk = "0.18"
gdk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[features]
default = ["automation"]
automation = ["dep:enigo", "dep:screenshots"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
