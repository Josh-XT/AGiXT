name: Build Desktop Client Downloads

on:
  push:
    branches:
      - main
    paths:
      - "clients/desktop/**"
      - ".github/workflows/desktop-prewarm.yml"
      - "!clients/desktop/**/*.md"
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated desktop targets to build and upload"
        required: false
        default: "macos,linux,windows,android,linux-arm64"

permissions:
  contents: read
  id-token: write

concurrency:
  group: desktop-client-downloads-${{ github.ref }}
  cancel-in-progress: true

env:
  DOWNLOAD_SERVER_URL: ${{ vars.DESKTOP_DOWNLOAD_SERVER_URL || 'https://download.xt.systems' }}
  DESKTOP_BUILD_TIMEZONE: ${{ vars.DESKTOP_BUILD_TIMEZONE || 'America/New_York' }}
  REQUESTED_TARGETS: ${{ github.event.inputs.targets || 'macos,linux,windows,android,linux-arm64' }}
  TAURI_CLI_VERSION: "2.11.1"

jobs:
  select-targets:
    name: Select Desktop Targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
    steps:
      - name: Build matrix
        id: matrix
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys

          definitions = {
              "macos": {
                  "name": "macOS Apple Silicon",
                  "os_type": "macos",
                  "runner": "macos-15",
                  "rust_target": "aarch64-apple-darwin",
                  "tauri_target": "aarch64-apple-darwin",
                  "kind": "macos",
                  "optional": False,
              },
              "linux": {
                  "name": "Linux x64",
                  "os_type": "linux",
                  "runner": "ubuntu-24.04",
                  "rust_target": "x86_64-unknown-linux-gnu",
                  "tauri_target": "x86_64-unknown-linux-gnu",
                  "kind": "linux",
                  "optional": False,
              },
              "windows": {
                  "name": "Windows x64",
                  "os_type": "windows",
                  "runner": "windows-latest",
                  "rust_target": "x86_64-pc-windows-msvc",
                  "tauri_target": "x86_64-pc-windows-msvc",
                  "kind": "windows",
                  "optional": False,
              },
              "android": {
                  "name": "Android ARM64 Preview",
                  "os_type": "android",
                  "runner": "ubuntu-24.04",
                  "rust_target": "aarch64-linux-android",
                  "tauri_target": "aarch64",
                  "kind": "android",
                  "optional": False,
              },
              "linux-arm64": {
                  "name": "Linux ARM64",
                  "os_type": "linux-arm64",
                  "runner": "ubuntu-24.04-arm",
                  "rust_target": "aarch64-unknown-linux-gnu",
                  "tauri_target": "aarch64-unknown-linux-gnu",
                  "kind": "linux",
                  "optional": False,
              },
              # Manual-only for now because the Intel macOS runner is slow and costly.
              "macos-x86": {
                  "name": "macOS Intel",
                  "os_type": "macos-x86",
                  "runner": "macos-15-intel",
                  "rust_target": "x86_64-apple-darwin",
                  "tauri_target": "x86_64-apple-darwin",
                  "kind": "macos",
                  "optional": True,
              },
          }
          order = ["macos", "linux", "windows", "android", "linux-arm64", "macos-x86"]
          requested = {
              target.strip().lower()
              for target in os.environ["REQUESTED_TARGETS"].split(",")
              if target.strip()
          }
          invalid = sorted(requested - definitions.keys())
          if invalid:
              print(f"Invalid desktop target(s): {', '.join(invalid)}", file=sys.stderr)
              sys.exit(1)

          include = [definitions[target] for target in order if target in requested]
          print(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}")
          print(f"has_targets={str(bool(include)).lower()}")
          PY

  build-desktop:
    name: Build ${{ matrix.name }}
    needs: select-targets
    if: needs.select-targets.outputs.has_targets == 'true'
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-targets.outputs.matrix) }}

    steps:
      - name: Checkout AGiXT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java for Android
        if: matrix.kind == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        if: matrix.kind == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: matrix.kind == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"
          {
            echo "ANDROID_SDK_ROOT=${ANDROID_HOME}"
            echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973"
            echo "NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973"
          } >> "$GITHUB_ENV"

      - name: Install Linux desktop dependencies
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libclang-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install Windows desktop dependencies
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          choco install llvm -y --no-progress
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"

      - name: Ensure Rust target
        shell: bash
        env:
          KIND: ${{ matrix.kind }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add "${RUST_TARGET}"
          if [ "${KIND}" = "android" ]; then
            rustup target add \
              armv7-linux-androideabi \
              i686-linux-android \
              x86_64-linux-android
          fi

      - name: Cache Rust desktop build state
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            clients/desktop/src-tauri/target
          key: desktop-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-${{ hashFiles('clients/desktop/src-tauri/Cargo.lock', 'clients/desktop/src-tauri/Cargo.toml', 'clients/desktop/src-tauri/tauri.conf.json', 'clients/desktop/package-lock.json') }}
          restore-keys: |
            desktop-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}-

      - name: Cache Android Gradle state
        if: matrix.kind == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: desktop-gradle-v2-${{ runner.os }}-${{ matrix.tauri_target }}-${{ hashFiles('clients/desktop/src-tauri/Cargo.lock', 'clients/desktop/src-tauri/tauri.conf.json', 'clients/desktop/package-lock.json') }}
          restore-keys: |
            desktop-gradle-v2-${{ runner.os }}-${{ matrix.tauri_target }}-

      - name: Install desktop npm dependencies
        working-directory: clients/desktop
        shell: bash
        run: npm ci

      - name: Resolve desktop build ID
        id: build_id
        shell: bash
        run: |
          set -euo pipefail
          commit_time="$(git log -1 --format=%ct -- \
            clients/desktop/src \
            clients/desktop/src-tauri \
            clients/desktop/package.json \
            clients/desktop/package-lock.json)"
          if [ -z "${commit_time}" ]; then
            commit_time="$(git log -1 --format=%ct)"
          fi
          python -m pip install --quiet tzdata
          version="$(DESKTOP_BUILD_TIMEZONE="${DESKTOP_BUILD_TIMEZONE}" COMMIT_TIME="${commit_time}" python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          timezone = ZoneInfo(os.environ["DESKTOP_BUILD_TIMEZONE"])
          timestamp = int(os.environ["COMMIT_TIME"])
          print(datetime.fromtimestamp(timestamp, timezone).strftime("%Y%m%d_%H%M%S"))
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check upload token
        shell: bash
        env:
          DESKTOP_UPLOAD_TOKEN: ${{ secrets.DESKTOP_UPLOAD_TOKEN || secrets.DESKTOP_PREWARM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_UPLOAD_TOKEN}" ]; then
            echo "DESKTOP_UPLOAD_TOKEN or DESKTOP_PREWARM_TOKEN is required to upload desktop artifacts to the download server." >&2
            exit 1
          fi

      - name: Build desktop artifact
        if: matrix.kind != 'android' && matrix.kind != 'windows'
        working-directory: clients/desktop/src-tauri
        shell: bash
        env:
          AGIXT_DESKTOP_BUILD_ID: ${{ steps.build_id.outputs.version }}
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" build \
            --target "${{ matrix.tauri_target }}"

      - name: Build Windows desktop binary
        if: matrix.kind == 'windows'
        working-directory: clients/desktop/src-tauri
        shell: bash
        env:
          AGIXT_DESKTOP_BUILD_ID: ${{ steps.build_id.outputs.version }}
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" build \
            --target "${{ matrix.tauri_target }}" \
            --no-bundle \
            --ci

      - name: Sign Windows desktop binary
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          TAURI_TARGET: ${{ matrix.tauri_target }}
          AGIXT_WINDOWS_SIGNING_REQUIRED: ${{ vars.AGIXT_WINDOWS_SIGNING_REQUIRED || 'false' }}
          AGIXT_WINDOWS_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AGIXT_WINDOWS_ARTIFACT_SIGNING_ENDPOINT }}
          AGIXT_WINDOWS_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AGIXT_WINDOWS_ARTIFACT_SIGNING_ACCOUNT }}
          AGIXT_WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AGIXT_WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          AGIXT_WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.AGIXT_WINDOWS_CODESIGN_TIMESTAMP_URL }}
          AGIXT_WINDOWS_CODESIGN_DESCRIPTION: "AGiXT Desktop"
          AGIXT_WINDOWS_CODESIGN_URL: "https://xt.systems"
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PATH: ${{ vars.WINDOWS_CERTIFICATE_PATH }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT || vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_CERTIFICATE_STORE_LOCATION: ${{ vars.WINDOWS_CERTIFICATE_STORE_LOCATION }}
        run: |
          $required = "${env:AGIXT_WINDOWS_SIGNING_REQUIRED}" -notmatch '^(0|false|no|off)$'
          $binary = Join-Path "${{ github.workspace }}" "clients\desktop\src-tauri\target\${env:TAURI_TARGET}\release\agixt-desktop.exe"
          & "${{ github.workspace }}\clients\desktop\scripts\sign-windows.ps1" -Path $binary -Required:$required

      - name: Bundle Windows desktop artifact
        if: matrix.kind == 'windows'
        working-directory: clients/desktop/src-tauri
        shell: bash
        env:
          AGIXT_DESKTOP_BUILD_ID: ${{ steps.build_id.outputs.version }}
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" bundle \
            --target "${{ matrix.tauri_target }}" \
            --ci

      - name: Sign Windows installer artifacts
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          TAURI_TARGET: ${{ matrix.tauri_target }}
          AGIXT_WINDOWS_SIGNING_REQUIRED: ${{ vars.AGIXT_WINDOWS_SIGNING_REQUIRED || 'false' }}
          AGIXT_WINDOWS_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AGIXT_WINDOWS_ARTIFACT_SIGNING_ENDPOINT }}
          AGIXT_WINDOWS_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AGIXT_WINDOWS_ARTIFACT_SIGNING_ACCOUNT }}
          AGIXT_WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AGIXT_WINDOWS_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          AGIXT_WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.AGIXT_WINDOWS_CODESIGN_TIMESTAMP_URL }}
          AGIXT_WINDOWS_CODESIGN_DESCRIPTION: "AGiXT Desktop"
          AGIXT_WINDOWS_CODESIGN_URL: "https://xt.systems"
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PATH: ${{ vars.WINDOWS_CERTIFICATE_PATH }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT || vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_CERTIFICATE_STORE_LOCATION: ${{ vars.WINDOWS_CERTIFICATE_STORE_LOCATION }}
        run: |
          $required = "${env:AGIXT_WINDOWS_SIGNING_REQUIRED}" -notmatch '^(0|false|no|off)$'
          $bundleDir = Join-Path "${{ github.workspace }}" "clients\desktop\src-tauri\target\${env:TAURI_TARGET}\release\bundle"
          & "${{ github.workspace }}\clients\desktop\scripts\sign-windows.ps1" -Path $bundleDir -Required:$required

      - name: Build Android preview artifact
        if: matrix.kind == 'android'
        working-directory: clients/desktop/src-tauri
        shell: bash
        env:
          AGIXT_DESKTOP_BUILD_ID: ${{ steps.build_id.outputs.version }}
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          expected_package_dir="$(python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("tauri.conf.json").read_text())
          print(Path("gen/android/app/src/main/java", *config["identifier"].split(".")))
          PY
          )"
          if [ ! -f gen/android/settings.gradle ] || [ ! -d "${expected_package_dir}" ]; then
            rm -rf gen/android
            npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" android init --ci
          fi
          npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" android build \
            --apk \
            --target "${{ matrix.tauri_target }}" \
            --ci

      - name: Find artifact
        id: artifact
        shell: bash
        env:
          OS_TYPE: ${{ matrix.os_type }}
          TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          os_type = os.environ["OS_TYPE"]
          target = os.environ["TARGET"]
          priorities = {
              ".deb": 0,
              ".dmg": 0,
              ".msi": 0,
              ".apk": 0,
              ".exe": 1,
              ".AppImage": 1,
              ".aab": 1,
              ".rpm": 2,
              ".app.tar.gz": 2,
              ".tar.gz": 3,
              ".zip": 4,
          }
          patterns = {
              "linux": ["**/*.deb", "**/*.AppImage", "**/*.rpm", "**/*.tar.gz"],
              "linux-arm64": ["**/*.deb", "**/*.AppImage", "**/*.rpm", "**/*.tar.gz"],
              "windows": ["**/*.msi", "**/*.exe", "**/*.zip"],
              "macos": ["**/*.dmg", "**/*.app.tar.gz", "**/*.tar.gz", "**/*.zip"],
              "macos-x86": ["**/*.dmg", "**/*.app.tar.gz", "**/*.tar.gz", "**/*.zip"],
              "android": ["**/*.apk", "**/*.aab"],
          }[os_type]

          if os_type == "android":
              roots = [Path("clients/desktop/src-tauri/gen/android")]
          else:
              release = Path("clients/desktop/src-tauri/target") / target / "release"
              roots = [release / "bundle", release]

          candidates = []
          for root in roots:
              if not root.exists():
                  continue
              for pattern in patterns:
                  candidates.extend(path for path in root.glob(pattern) if path.is_file())

          def suffix(path: Path) -> str:
              lower = path.name.lower()
              for value in [
                  ".app.tar.gz",
                  ".tar.gz",
                  ".appimage",
                  ".deb",
                  ".dmg",
                  ".msi",
                  ".exe",
                  ".rpm",
                  ".apk",
                  ".aab",
                  ".zip",
              ]:
                  if lower.endswith(value):
                      return ".AppImage" if value == ".appimage" else value
              return path.suffix

          candidates.sort(
              key=lambda path: (
                  priorities.get(suffix(path), 50),
                  -path.stat().st_mtime,
              )
          )
          if not candidates:
              raise SystemExit(f"No artifact found for {os_type}")
          artifact = candidates[0]
          print(f"path={artifact.as_posix()}")
          print(f"name={artifact.name}")
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agixt-desktop-${{ matrix.os_type }}-${{ steps.build_id.outputs.version }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Verify Windows artifact signature
        if: matrix.kind == 'windows'
        shell: pwsh
        env:
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
          AGIXT_WINDOWS_SIGNING_REQUIRED: ${{ vars.AGIXT_WINDOWS_SIGNING_REQUIRED || 'false' }}
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath "${env:ARTIFACT_PATH}"
          if ($signature.Status -ne "Valid") {
            $message = "Windows artifact is not Authenticode signed: $($signature.Status). $($signature.StatusMessage)"
            if ("${env:AGIXT_WINDOWS_SIGNING_REQUIRED}" -notmatch '^(0|false|no|off)$') {
              throw $message
            }
            Write-Warning $message
          } else {
            Write-Host "Windows artifact signature verified: $($signature.SignerCertificate.Subject)"
          }

      - name: Upload artifact to download server
        shell: bash
        env:
          DESKTOP_UPLOAD_TOKEN: ${{ secrets.DESKTOP_UPLOAD_TOKEN || secrets.DESKTOP_PREWARM_TOKEN }}
          OS_TYPE: ${{ matrix.os_type }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          DESKTOP_BUILD_ID: ${{ steps.build_id.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Accept: application/json" \
            -H "X-Desktop-Upload-Token: ${DESKTOP_UPLOAD_TOKEN}" \
            -H "X-Desktop-Build-ID: ${DESKTOP_BUILD_ID}" \
            -H "X-Artifact-Name: ${ARTIFACT_NAME}" \
            --data-binary "@${ARTIFACT_PATH}" \
            "${DOWNLOAD_SERVER_URL}/desktop/upload/${OS_TYPE}"
