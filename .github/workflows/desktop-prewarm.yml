name: Build Desktop Client Downloads

on:
  push:
    branches:
      - main
    paths:
      - "clients/desktop/**"
      - "!clients/desktop/**/*.md"
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated desktop targets to build or queue"
        required: false
        default: "linux,linux-arm64,windows,android,macos,macos-x86,ios"

permissions:
  contents: read

concurrency:
  group: desktop-client-downloads-${{ github.ref }}
  cancel-in-progress: false

env:
  DOWNLOAD_SERVER_URL: ${{ vars.DESKTOP_DOWNLOAD_SERVER_URL || 'https://download.xt.systems' }}
  DESKTOP_BUILD_TIMEZONE: ${{ vars.DESKTOP_BUILD_TIMEZONE || 'America/New_York' }}
  TAURI_CLI_VERSION: "2.11.1"

jobs:
  queue-server-builds:
    name: Queue Server-Built Desktop Targets
    runs-on: ubuntu-latest
    steps:
      - name: Select server-built targets
        id: targets
        env:
          REQUESTED_TARGETS: ${{ github.event.inputs.targets || 'linux,linux-arm64,windows,android,macos,macos-x86,ios' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os

          requested = {
              target.strip().lower()
              for target in os.environ["REQUESTED_TARGETS"].split(",")
              if target.strip()
          }
          server_targets = ["linux", "linux-arm64", "windows", "android"]
          selected = [target for target in server_targets if target in requested]
          print(f"targets={','.join(selected)}")
          PY

      - name: Queue download server builds
        if: steps.targets.outputs.targets != ''
        env:
          PREWARM_TOKEN: ${{ secrets.DESKTOP_PREWARM_TOKEN }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          headers=(-H "Accept: application/json")
          if [ -n "${PREWARM_TOKEN}" ]; then
            headers+=(-H "X-Prewarm-Token: ${PREWARM_TOKEN}")
          fi
          curl -fsS -X POST "${headers[@]}" \
            "${DOWNLOAD_SERVER_URL}/desktop/prewarm?targets=${TARGETS}"

  build-apple:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os_type: macos
            runner: macos-15
            rust_target: aarch64-apple-darwin
            tauri_target: aarch64-apple-darwin
            kind: macos
            optional: false
          - name: macOS Intel
            os_type: macos-x86
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            tauri_target: x86_64-apple-darwin
            kind: macos
            optional: false
          - name: iOS
            os_type: ios
            runner: macos-15
            rust_target: aarch64-apple-ios
            tauri_target: aarch64
            kind: ios
            optional: true
    steps:
      - name: Check requested target
        id: requested
        env:
          REQUESTED_TARGETS: ${{ github.event.inputs.targets || 'linux,linux-arm64,windows,android,macos,macos-x86,ios' }}
          OS_TYPE: ${{ matrix.os_type }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os

          requested = {
              target.strip().lower()
              for target in os.environ["REQUESTED_TARGETS"].split(",")
              if target.strip()
          }
          print(f"enabled={str(os.environ['OS_TYPE'] in requested).lower()}")
          PY

      - name: Check iOS signing setup
        if: steps.requested.outputs.enabled == 'true' && matrix.kind == 'ios'
        id: ios_signing
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_DEVELOPMENT_TEAM \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_PROVISIONING_PROFILE_BASE64
          do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            joined="$(IFS=, ; echo "${missing[*]}")"
            echo "::notice title=iOS build skipped::Missing iOS signing secrets: ${joined}. Add these secrets to build and upload the iOS artifact."
          fi

      - name: Decide build gate
        if: steps.requested.outputs.enabled == 'true'
        id: build_gate
        env:
          KIND: ${{ matrix.kind }}
          IOS_SIGNING_ENABLED: ${{ steps.ios_signing.outputs.enabled }}
        run: |
          set -euo pipefail
          if [ "${KIND}" != "ios" ] || [ "${IOS_SIGNING_ENABLED}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout AGiXT
        if: steps.build_gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        if: steps.build_gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json

      - name: Ensure Rust target
        if: steps.build_gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup target add "${{ matrix.rust_target }}"

      - name: Install desktop dependencies
        if: steps.build_gate.outputs.enabled == 'true'
        working-directory: clients/desktop
        run: npm ci

      - name: Resolve desktop build ID
        if: steps.build_gate.outputs.enabled == 'true'
        id: build_id
        run: |
          set -euo pipefail
          commit_time="$(git log -1 --format=%ct -- \
            clients/desktop/src \
            clients/desktop/src-tauri \
            clients/desktop/package.json \
            clients/desktop/package-lock.json)"
          if [ -z "${commit_time}" ]; then
            commit_time="$(git log -1 --format=%ct)"
          fi
          version="$(TZ="${DESKTOP_BUILD_TIMEZONE}" COMMIT_TIME="${commit_time}" python3 - <<'PY'
          import os
          from datetime import datetime

          print(datetime.fromtimestamp(int(os.environ["COMMIT_TIME"])).strftime("%Y%m%d_%H%M%S"))
          PY
          )"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Check upload token
        if: steps.build_gate.outputs.enabled == 'true'
        env:
          DESKTOP_UPLOAD_TOKEN: ${{ secrets.DESKTOP_UPLOAD_TOKEN || secrets.DESKTOP_PREWARM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_UPLOAD_TOKEN}" ]; then
            echo "DESKTOP_UPLOAD_TOKEN or DESKTOP_PREWARM_TOKEN is required to upload Apple desktop artifacts to the download server." >&2
            exit 1
          fi

      - name: Install Apple signing assets
        if: steps.build_gate.outputs.enabled == 'true' && matrix.kind == 'ios'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          cert_path="${RUNNER_TEMP}/apple_certificate.p12"
          profile_path="${RUNNER_TEMP}/apple_profile.mobileprovision"
          profile_plist="${RUNNER_TEMP}/apple_profile.plist"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          CERT_PATH="${cert_path}" PROFILE_PATH="${profile_path}" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"])
          )
          Path(os.environ["PROFILE_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_PROVISIONING_PROFILE_BASE64"])
          )
          PY
          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${cert_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}"
          existing_keychains="$(security list-keychains -d user | tr -d '"' || true)"
          security list-keychains -d user -s "${keychain_path}" ${existing_keychains}
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${keychain_password}" \
            "${keychain_path}"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "${profile_path}" > "${profile_plist}"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${profile_plist}")"
          cp "${profile_path}" \
            "${HOME}/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

      - name: Build macOS artifact
        if: steps.build_gate.outputs.enabled == 'true' && matrix.kind == 'macos'
        working-directory: clients/desktop/src-tauri
        env:
          AGIXT_DESKTOP_BUILD_ID: ${{ steps.build_id.outputs.version }}
        run: |
          set -euo pipefail
          npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" build --target "${{ matrix.tauri_target }}"

      - name: Build iOS artifact
        if: steps.build_gate.outputs.enabled == 'true' && matrix.kind == 'ios'
        working-directory: clients/desktop/src-tauri
        env:
          AGIXT_DESKTOP_BUILD_ID: ${{ steps.build_id.outputs.version }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          if [ ! -d gen/apple ]; then
            npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" ios init --ci
          fi
          npx -y "@tauri-apps/cli@${TAURI_CLI_VERSION}" ios build \
            --target "${{ matrix.tauri_target }}" \
            --ci

      - name: Find artifact
        if: steps.build_gate.outputs.enabled == 'true'
        id: artifact
        env:
          OS_TYPE: ${{ matrix.os_type }}
          TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path

          os_type = os.environ["OS_TYPE"]
          target = os.environ["TARGET"]
          priorities = {
              ".dmg": 0,
              ".ipa": 0,
              ".app.tar.gz": 1,
              ".tar.gz": 2,
              ".zip": 3,
          }
          patterns = {
              "macos": ["**/*.dmg", "**/*.app.tar.gz", "**/*.tar.gz", "**/*.zip"],
              "macos-x86": ["**/*.dmg", "**/*.app.tar.gz", "**/*.tar.gz", "**/*.zip"],
              "ios": ["**/*.ipa"],
          }[os_type]
          roots = []
          if os_type == "ios":
              roots.append(Path("clients/desktop/src-tauri/gen/apple"))
          else:
              release = Path("clients/desktop/src-tauri/target") / target / "release"
              roots.extend([release / "bundle", release])

          candidates = []
          for root in roots:
              if not root.exists():
                  continue
              for pattern in patterns:
                  candidates.extend(path for path in root.glob(pattern) if path.is_file())

          def suffix(path: Path) -> str:
              lower = path.name.lower()
              for value in [".app.tar.gz", ".tar.gz", ".dmg", ".ipa", ".zip"]:
                  if lower.endswith(value):
                      return value
              return ""

          candidates.sort(
              key=lambda path: (priorities.get(suffix(path), 50), -path.stat().st_mtime)
          )
          if not candidates:
              raise SystemExit(f"No artifact found for {os_type}")
          artifact = candidates[0]
          print(f"path={artifact}")
          print(f"name={artifact.name}")
          PY

      - name: Upload artifact to download server
        if: steps.build_gate.outputs.enabled == 'true'
        env:
          DESKTOP_UPLOAD_TOKEN: ${{ secrets.DESKTOP_UPLOAD_TOKEN || secrets.DESKTOP_PREWARM_TOKEN }}
          OS_TYPE: ${{ matrix.os_type }}
          ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          DESKTOP_BUILD_ID: ${{ steps.build_id.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_UPLOAD_TOKEN}" ]; then
            echo "DESKTOP_UPLOAD_TOKEN or DESKTOP_PREWARM_TOKEN is required" >&2
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/json" \
            -H "X-Desktop-Upload-Token: ${DESKTOP_UPLOAD_TOKEN}" \
            -H "X-Desktop-Build-ID: ${DESKTOP_BUILD_ID}" \
            -H "X-Artifact-Name: ${ARTIFACT_NAME}" \
            --data-binary "@${ARTIFACT_PATH}" \
            "${DOWNLOAD_SERVER_URL}/desktop/upload/${OS_TYPE}"
